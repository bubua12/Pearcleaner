name: Build (unsigned)

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Pearcleaner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # github.com/<owner>/<repo>/releases/download/... sometimes returns 504 for
      # Sparkle's SPM binary zip. Pre-seed SwiftPM's shared artifact cache via the
      # REST API (different CDN path); SwiftPM still verifies the checksum.
      - name: Pre-seed Sparkle binary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import json;d=json.load(open('Pearcleaner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'));print([p['state']['version'] for p in d['pins'] if 'sparkle' in p['location'].lower()][0])")
          NAME=Sparkle-for-Swift-Package-Manager.zip
          URL="https://github.com/sparkle-project/Sparkle/releases/download/$VER/$NAME"
          ID=$(gh api repos/sparkle-project/Sparkle/releases/tags/$VER --jq ".assets[] | select(.name==\"$NAME\") | .id")
          CACHE="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$CACHE"
          MANGLED=$(python3 -c "import re,sys;u=sys.argv[1];m=re.sub(r'[^A-Za-z0-9_]','_',u);print(('_'+m) if m[0].isdigit() else m)" "$URL")
          for i in 1 2 3; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/sparkle-project/Sparkle/releases/assets/$ID" -o "$CACHE/$MANGLED" && break
            sleep 10
          done
          ls -l "$CACHE"
          shasum -a 256 "$CACHE/$MANGLED"

      - name: Resolve Swift packages (with retries)
        run: |
          for i in 1 2 3 4 5; do
            xcodebuild -resolvePackageDependencies \
              -project Pearcleaner.xcodeproj \
              -scheme "Pearcleaner Release" \
              -clonedSourcePackagesDirPath build/SourcePackages && exit 0
            echo "Package resolution failed (attempt $i), retrying in $((i*15))s..."
            sleep $((i*15))
          done
          exit 1

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pearcleaner.xcodeproj \
            -scheme "Pearcleaner Release" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*macos27|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log || { grep -E "error:" build/xcodebuild.log | head -50; exit 1; }

      - name: Package app
        run: |
          APP=$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP"
          ls "$APP/Contents" "$APP/Contents/Library" 2>/dev/null || true
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Pearcleaner-unsigned.zip
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Pearcleaner-unsigned-${{ github.ref_name }}-${{ github.sha }}
          path: dist/Pearcleaner-unsigned.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
